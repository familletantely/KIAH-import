<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIAH Import</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#050816;
  --bg2:#0b1028;
  --card:rgba(255,255,255,.08);
  --card2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.14);
  --text:#f8fafc;
  --muted:#a7b0c5;
  --blue:#38bdf8;
  --violet:#8b5cf6;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(56,189,248,.25),transparent 32%),
    radial-gradient(circle at top right,rgba(139,92,246,.25),transparent 34%),
    linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--text);
  min-height:100vh;
}
button,input,select{font-family:inherit}
input,select{
  width:100%;
  padding:15px;
  border:1px solid var(--line);
  border-radius:18px;
  margin:7px 0;
  background:rgba(255,255,255,.08);
  color:var(--text);
  font-size:16px;
  outline:none;
}
select option{background:#111827;color:white}
input::placeholder{color:#7f8aa3}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(56,189,248,.16)}
button{
  border:none;
  border-radius:18px;
  padding:13px 16px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}
.login-card{
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(18px);
  border:1px solid var(--line);
  width:100%;
  max-width:390px;
  border-radius:30px;
  padding:28px;
  box-shadow:0 25px 80px rgba(0,0,0,.32);
}
.login-card h1{margin:0 0 25px;font-size:32px;background:linear-gradient(90deg,var(--blue),var(--violet));-webkit-background-clip:text;color:transparent}
.primary{
  width:100%;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  color:white;
  margin-top:8px;
  box-shadow:0 12px 28px rgba(56,189,248,.18);
}
.error{color:#fca5a5;margin-top:10px;font-size:13px}
.app{display:none;padding-bottom:112px}
.top{
  padding:18px 16px 24px;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  border-bottom-left-radius:30px;
  border-bottom-right-radius:30px;
}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:26px;margin:0;background:linear-gradient(90deg,var(--blue),#fff,var(--violet));-webkit-background-clip:text;color:transparent}
.top small{color:var(--muted)}
.user-btn{background:rgba(255,255,255,.12);color:white;border:1px solid var(--line);padding:10px 12px;border-radius:16px;font-size:13px}
.container{padding:16px;max-width:850px;margin:auto}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 18px 55px rgba(0,0,0,.22);
  backdrop-filter:blur(16px);
}
.card h2{margin:0 0 12px;font-size:22px}
.result{
  font-size:30px;
  font-weight:950;
  margin-top:12px;
  color:white;
  text-shadow:0 0 22px rgba(56,189,248,.45);
}
.tabs{
  position:fixed;
  bottom:12px;
  left:10px;
  right:10px;
  display:flex;
  gap:8px;
  z-index:20;
  padding:8px;
  background:rgba(5,8,22,.72);
  backdrop-filter:blur(18px);
  border:1px solid var(--line);
  border-radius:24px;
}
.tabs button{flex:1;background:rgba(255,255,255,.08);color:var(--muted);padding:13px 6px;font-size:13px}
.tabs button.active{background:linear-gradient(135deg,var(--blue),var(--violet));color:white}
.logout{position:fixed;right:14px;bottom:88px;background:rgba(239,68,68,.92);color:white;z-index:30;box-shadow:0 12px 30px rgba(239,68,68,.2)}
.section{display:none}
.section.active{display:block}
.mode-buttons,.date-buttons,.frais-buttons{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.mode-buttons button,.date-buttons button,.frais-buttons button{white-space:nowrap;background:rgba(255,255,255,.08);color:#dbeafe;border:1px solid var(--line)}
.mode-buttons button.active,.date-buttons button.active,.frais-buttons button.active{background:linear-gradient(135deg,var(--blue),var(--violet));color:white}
.article{
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
  margin-top:12px;
  background:rgba(255,255,255,.07);
}
.article.compact{padding:12px}
.article-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.article-ref{font-weight:950;font-size:17px;color:white}
.article-name{color:#dbeafe;margin-top:4px}
.badge{background:rgba(56,189,248,.15);color:#bae6fd;border:1px solid rgba(56,189,248,.28);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;height:max-content;white-space:nowrap}
.count{color:var(--muted);font-size:13px;margin-top:4px}
.status-line{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mini-status{background:rgba(255,255,255,.08);color:#cbd5e1;padding:7px 9px;border-radius:999px;font-size:12px;font-weight:800}
.mini-status.done{background:rgba(250,204,21,.18);color:#fde68a;border:1px solid rgba(250,204,21,.25)}
.action-row{display:flex;gap:8px;margin-top:10px}
.action-row button{flex:1;font-size:13px;padding:11px 10px}
.edit-btn{background:rgba(56,189,248,.18);color:#bae6fd;border:1px solid rgba(56,189,248,.3)}
.delete{background:rgba(239,68,68,.88);color:white;width:100%}
.save{background:linear-gradient(135deg,var(--green),#16a34a);color:white;width:100%}
.cancel{background:rgba(255,255,255,.1);color:white;width:100%;border:1px solid var(--line)}
.delete-all{background:#b91c1c;color:white;width:100%;margin-top:18px}
.download{background:linear-gradient(135deg,#22c55e,#16a34a);color:white;margin-top:14px;width:100%}
.empty{color:var(--muted);text-align:center;padding:22px}
.ship-box{margin-top:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:12px}
.ship-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.ship-row input{margin:0;padding:12px;border-radius:14px}
.ship-result{font-weight:950;color:#bae6fd;text-align:right}
.summary-box{margin-top:16px;background:rgba(56,189,248,.12);color:#e0f2fe;border:1px solid rgba(56,189,248,.22);border-radius:20px;padding:14px;font-weight:950;line-height:1.7}
.edit-panel{margin-top:12px;padding:12px;border-radius:20px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.grid-2{grid-template-columns:1fr}.ship-row{grid-template-columns:1fr}.ship-result{text-align:left}.top h1{font-size:23px}}
</style>
</head>

<body>

<div id="loginScreen" class="login">
  <div class="login-card">
    <h1>KIAH Import</h1>
    <input id="emailInput" type="email" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Mot de passe">
    <button class="primary" onclick="login()">Se connecter</button>
    <div id="errorBox" class="error"></div>
  </div>
</div>

<div id="app" class="app">

  <div class="top">
    <div class="top-row">
      <button class="user-btn" onclick="changeUser()">Changer utilisateur</button>
      <div style="text-align:right">
        <h1>KIAH Import</h1>
        <small id="currentUserLabel">Utilisateur</small>
      </div>
    </div>
  </div>

  <div class="container">

    <div id="frais" class="section active">
      <div class="card">
        <h2>Frais</h2>
        <div class="frais-buttons">
          <button id="btnFraisSEA" class="active" onclick="selectFraisMode('SEA')">SEA</button>
          <button id="btnFraisAIR" onclick="selectFraisMode('AIR')">AIR</button>
          <button id="btnFraisEXP" onclick="selectFraisMode('EXP')">EXP</button>
          <button id="btnFraisAIRBATT" onclick="selectFraisMode('AIR BATT')">AIR BATT</button>
        </div>

        <div id="calcSeaBox">
          <input id="cbm" type="number" placeholder="CBM" oninput="calcAll(); renderExpeditions();">
          <input id="prixCBM" type="number" value="360" placeholder="Prix CBM en dollar" oninput="calcAll(); renderExpeditions();">
          <input id="usd" type="number" value="4750" placeholder="Dollar en Ariary" oninput="calcAll(); renderExpeditions();">
          <div class="result" id="resultSea">0 Ar</div>
        </div>

        <div id="calcAirBox" style="display:none">
          <input id="kg" type="number" placeholder="Poids Kg" oninput="calcAll(); renderExpeditions();">
          <input id="prixKg" type="number" value="69000" placeholder="Prix Kg AIR" oninput="calcAll(); renderExpeditions();">
          <div class="result" id="resultAir">0 Ar</div>
        </div>

        <div id="calcExpBox" style="display:none">
          <input id="kgExp" type="number" placeholder="Poids Kg" oninput="calcAll(); renderExpeditions();">
          <input id="prixKgExp" type="number" value="80000" placeholder="Prix Kg EXP" oninput="calcAll(); renderExpeditions();">
          <div class="result" id="resultExp">0 Ar</div>
        </div>

        <div id="calcAirBattBox" style="display:none">
          <input id="kgAirBatt" type="number" placeholder="Poids Kg" oninput="calcAll(); renderExpeditions();">
          <input id="prixKgAirBatt" type="number" value="120000" placeholder="Prix Kg AIR BATT" oninput="calcAll(); renderExpeditions();">
          <div class="result" id="resultAirBatt">0 Ar</div>
        </div>
      </div>
    </div>

    <div id="list" class="section">
      <div class="card">
        <h2>Inscription article</h2>
        <input id="refInput" placeholder="Référence article">
        <input id="nameInput" placeholder="Nom de l’article">
        <select id="modeInput">
          <option>SEA</option>
          <option>AIR</option>
          <option>EXP</option>
          <option>AIR BATT</option>
          <option>AUTRE</option>
        </select>
        <button class="primary" onclick="addItem()">Ajouter</button>

        <div id="modeButtons" class="mode-buttons"></div>
        <div id="categoryTotal" class="count"></div>
      </div>

      <div id="listCapture" class="card">
        <h2 id="listTitle">Liste articles</h2>
        <input id="searchInput" placeholder="Recherche par référence ou nom" oninput="renderArticles()">
        <div id="items"></div>
        <button class="download" onclick="downloadCurrentList()">Télécharger liste PNG</button>
      </div>
    </div>

    <div id="expeditions" class="section">
      <div class="card">
        <h2>Expéditions</h2>
        <div id="expModeButtons" class="mode-buttons"></div>
        <div id="expDateButtons" class="date-buttons"></div>
        <div id="expTotal" class="count"></div>
      </div>

      <div id="expCapture" class="card">
        <h2 id="expTitle">Liste expédiée</h2>
        <div id="expItems"></div>
        <div id="expSummary"></div>
        <button id="downloadExpBtn" class="download" onclick="downloadCurrentExpedition()" style="display:none;">
          Capturer cette liste PNG
        </button>
        <button id="deleteAllExpBtn" class="delete-all" onclick="deleteAllCurrentExpedition()" style="display:none;">
          Supprimer tout cette liste
        </button>
      </div>
    </div>

  </div>

  <button class="logout" onclick="logout()">Déconnexion</button>

  <div class="tabs">
    <button class="active" onclick="openTab('frais',this)">Frais</button>
    <button onclick="openTab('list',this)">Articles</button>
    <button onclick="openTab('expeditions',this)">Expéditions</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyATZL0nUdSchECCaBhgr77qn2ZeFqAkKOs",
  authDomain: "kiah-import.firebaseapp.com",
  databaseURL: "https://kiah-import-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kiah-import",
  storageBucket: "kiah-import.firebasestorage.app",
  messagingSenderId: "722760438358",
  appId: "1:722760438358:web:aba00bedd603b568be61f7"
};

const appFirebase = initializeApp(firebaseConfig);
const db = getDatabase(appFirebase);
const auth = getAuth(appFirebase);

const MODES = ["SEA","AIR","EXP","AIR BATT","AUTRE"];
const WEIGHT_MODES = ["AIR","EXP","AIR BATT"];

let currentUserKey = "";
let currentUserEmail = "";
let selectedUserKey = "GLOBAL";
let selectedMode = "";
let selectedExpMode = "";
let selectedExpDate = "";
let selectedFraisMode = "SEA";
let editingArticleId = "";
let allUsers = {};
let allArticles = {};
let listenersStarted = false;

function safeKey(email){
  return email.replaceAll(".", "_").replaceAll("@", "_");
}

function formatAr(value){
  return Math.round(value || 0).toLocaleString("fr-FR") + " Ar";
}

function getSeaPricePerCbm(){
  let prix = parseFloat(document.getElementById("prixCBM").value)||0;
  let usd = parseFloat(document.getElementById("usd").value)||0;
  return prix * usd;
}

function getKgPrice(mode){
  if(mode === "EXP") return parseFloat(document.getElementById("prixKgExp").value)||0;
  if(mode === "AIR BATT") return parseFloat(document.getElementById("prixKgAirBatt").value)||0;
  return parseFloat(document.getElementById("prixKg").value)||0;
}

window.login = function(){
  const email = document.getElementById("emailInput").value.trim();
  const pass = document.getElementById("passwordInput").value;
  document.getElementById("errorBox").innerText = "";

  signInWithEmailAndPassword(auth,email,pass)
  .catch((error)=>{
    document.getElementById("errorBox").innerText = error.message;
  });
}

window.logout = function(){ 
  signOut(auth); 
}

onAuthStateChanged(auth, async (user)=>{
  if(user){
    currentUserEmail = user.email;
    currentUserKey = safeKey(user.email);
    selectedUserKey = currentUserKey;

    await update(ref(db,"users/"+currentUserKey), {
      email:user.email
    });

    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("currentUserLabel").innerText = user.email;

    if(!listenersStarted){
      listenersStarted = true;
      listenUsers();
      listenArticles();
    }
  }else{
    document.getElementById("app").style.display="none";
    document.getElementById("loginScreen").style.display="flex";
  }
});

function listenUsers(){
  onValue(ref(db,"users"), snap=>{
    allUsers = snap.val() || {};
  });
}

function listenArticles(){
  onValue(ref(db,"articles"), snap=>{
    allArticles = snap.val() || {};
    renderModeButtons();
    renderArticles();
    renderExpeditionModeButtons();
    renderExpeditions();
  });
}

window.changeUser = function(){
  let keys = ["GLOBAL"];
  let labels = ["GLOBAL"];

  Object.keys(allUsers).forEach(k=>{
    keys.push(k);
    labels.push(allUsers[k].email);
  });

  let message = "Choisir utilisateur :\n";
  labels.forEach((label,i)=> message += `${i+1}. ${label}\n`);

  let num = prompt(message);
  let index = parseInt(num) - 1;

  if(isNaN(index) || !keys[index]) return;

  selectedUserKey = keys[index];
  document.getElementById("currentUserLabel").innerText = labels[index];

  selectedMode = "";
  selectedExpMode = "";
  selectedExpDate = "";
  editingArticleId = "";

  renderModeButtons();
  renderArticles();
  renderExpeditionModeButtons();
  renderExpeditions();
}

function getVisibleArticles(){
  let result = [];

  Object.keys(allArticles).forEach(id=>{
    let item = {...allArticles[id]};
    item.id = id;

    if(selectedUserKey === "GLOBAL" || item.userKey === selectedUserKey){
      result.push(item);
    }
  });

  result.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return result;
}

/* FRAIS */
window.selectFraisMode = function(mode){
  selectedFraisMode = mode;
  const map = {
    "SEA":"calcSeaBox",
    "AIR":"calcAirBox",
    "EXP":"calcExpBox",
    "AIR BATT":"calcAirBattBox"
  };
  Object.values(map).forEach(id=>document.getElementById(id).style.display="none");
  document.getElementById(map[mode]).style.display="block";

  document.querySelectorAll(".frais-buttons button").forEach(b=>b.classList.remove("active"));
  if(mode === "SEA") document.getElementById("btnFraisSEA").classList.add("active");
  if(mode === "AIR") document.getElementById("btnFraisAIR").classList.add("active");
  if(mode === "EXP") document.getElementById("btnFraisEXP").classList.add("active");
  if(mode === "AIR BATT") document.getElementById("btnFraisAIRBATT").classList.add("active");
  calcAll();
}

window.calcAll = function(){
  calcSea();
  calcAir();
  calcExp();
  calcAirBatt();
}

/* ARTICLES */
function renderModeButtons(){
  let articles = getVisibleArticles();
  let counts = {};

  articles.forEach(a=>{
    counts[a.mode] = (counts[a.mode] || 0) + 1;
  });

  let box = document.getElementById("modeButtons");
  box.innerHTML = "";

  MODES.forEach(mode=>{
    if(counts[mode]){
      if(!selectedMode) selectedMode = mode;
      box.innerHTML += `<button class="${selectedMode===mode?'active':''}" onclick="selectMode('${mode}')">${mode} (${counts[mode]})</button>`;
    }
  });

  if(selectedMode && !counts[selectedMode]){
    selectedMode = Object.keys(counts)[0] || "";
  }
}

window.selectMode = function(mode){
  selectedMode = mode;
  editingArticleId = "";
  renderModeButtons();
  renderArticles();
}

window.addItem = function(){
  let refVal = document.getElementById("refInput").value.trim();
  let nameVal = document.getElementById("nameInput").value.trim();
  let modeVal = document.getElementById("modeInput").value;

  if(!refVal) return;

  push(ref(db,"articles"),{
    ref: refVal,
    name: nameVal,
    mode: modeVal,
    achat: "",
    depot: "",
    expedie: "",
    userKey: currentUserKey,
    createdBy: currentUserEmail,
    createdAt: Date.now()
  });

  document.getElementById("refInput").value = "";
  document.getElementById("nameInput").value = "";
  selectedMode = modeVal;
}

window.renderArticles = function(){
  let search = document.getElementById("searchInput").value.toLowerCase().trim();
  let articles = getVisibleArticles();

  if(selectedMode){
    articles = articles.filter(a=>a.mode === selectedMode);
  }

  if(search){
    articles = articles.filter(a=>
      (a.ref || "").toLowerCase().includes(search) ||
      (a.name || "").toLowerCase().includes(search)
    );
  }

  document.getElementById("listTitle").innerText = selectedMode ? `Liste ${selectedMode}` : "Liste articles";
  document.getElementById("categoryTotal").innerText = selectedMode ? `Total ${selectedMode} : ${articles.length} article(s)` : "";

  let box = document.getElementById("items");
  box.innerHTML = "";

  if(!articles.length){
    box.innerHTML = `<div class="empty">Aucun article disponible</div>`;
    return;
  }

  articles.forEach(item=>{
    let isEditing = editingArticleId === item.id;
    let editPanel = "";

    if(isEditing){
      editPanel = `
        <div class="edit-panel">
          <div class="grid-2">
            <input id="editRef_${item.id}" value="${escapeHtml(item.ref || "")}" placeholder="Référence">
            <input id="editName_${item.id}" value="${escapeHtml(item.name || "")}" placeholder="Nom article">
          </div>
          <select id="editMode_${item.id}">
            ${MODES.map(m=>`<option ${item.mode===m?'selected':''}>${m}</option>`).join("")}
          </select>
          <div class="grid-2">
            <input id="editAchat_${item.id}" value="${escapeHtml(item.achat || "")}" placeholder="Date achat">
            <input id="editDepot_${item.id}" value="${escapeHtml(item.depot || "")}" placeholder="Date dépôt">
          </div>
          <input id="editExpedie_${item.id}" value="${escapeHtml(item.expedie || "")}" placeholder="Date expédié">
          <div class="action-row">
            <button class="save" onclick="saveArticleEdit('${item.id}')">Enregistrer</button>
            <button class="cancel" onclick="cancelArticleEdit()">Fermer</button>
          </div>
        </div>
      `;
    }

    box.innerHTML += `
      <div class="article compact">
        <div class="article-head">
          <div>
            <div class="article-ref">${escapeHtml(item.ref || "")}</div>
            <div class="article-name">${escapeHtml(item.name || "")}</div>
            <div class="count">${escapeHtml(item.createdBy || "")}</div>
          </div>
          <div class="badge">${escapeHtml(item.mode || "")}</div>
        </div>

        <div class="status-line">
          <span class="mini-status ${item.achat?'done':''}">Achat: ${escapeHtml(item.achat || "—")}</span>
          <span class="mini-status ${item.depot?'done':''}">Dépôt: ${escapeHtml(item.depot || "—")}</span>
          <span class="mini-status ${item.expedie?'done':''}">Expédié: ${escapeHtml(item.expedie || "—")}</span>
        </div>

        <div class="action-row">
          <button class="edit-btn" onclick="startArticleEdit('${item.id}')">Modifier</button>
          <button class="delete" onclick="deleteArticle('${item.id}')">Supprimer</button>
        </div>
        ${editPanel}
      </div>
    `;
  });
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

window.startArticleEdit = function(id){
  editingArticleId = id;
  renderArticles();
}

window.cancelArticleEdit = function(){
  editingArticleId = "";
  renderArticles();
}

window.saveArticleEdit = function(id){
  let refVal = document.getElementById(`editRef_${id}`).value.trim();
  let nameVal = document.getElementById(`editName_${id}`).value.trim();
  let modeVal = document.getElementById(`editMode_${id}`).value;
  let achatVal = document.getElementById(`editAchat_${id}`).value.trim();
  let depotVal = document.getElementById(`editDepot_${id}`).value.trim();
  let expedieVal = document.getElementById(`editExpedie_${id}`).value.trim();

  if(!refVal){
    alert("La référence est obligatoire");
    return;
  }

  update(ref(db,`articles/${id}`), {
    ref: refVal,
    name: nameVal,
    mode: modeVal,
    achat: achatVal,
    depot: depotVal,
    expedie: expedieVal
  });

  selectedMode = modeVal;
  editingArticleId = "";
}

window.deleteArticle = function(id){
  if(confirm("Supprimer cet article définitivement ?")){
    remove(ref(db,`articles/${id}`));
  }
}

/* EXPEDITIONS */
function getShippedArticles(){
  return getVisibleArticles().filter(a => (a.expedie || "").trim() !== "");
}

function renderExpeditionModeButtons(){
  let articles = getShippedArticles();
  let counts = {};

  articles.forEach(a=>{
    counts[a.mode] = (counts[a.mode] || 0) + 1;
  });

  let box = document.getElementById("expModeButtons");
  box.innerHTML = "";

  MODES.forEach(mode=>{
    if(counts[mode]){
      if(!selectedExpMode) selectedExpMode = mode;
      box.innerHTML += `<button class="${selectedExpMode===mode?'active':''}" onclick="selectExpMode('${mode}')">${mode} (${counts[mode]})</button>`;
    }
  });

  if(selectedExpMode && !counts[selectedExpMode]){
    selectedExpMode = Object.keys(counts)[0] || "";
    selectedExpDate = "";
  }
}

window.selectExpMode = function(mode){
  selectedExpMode = mode;
  selectedExpDate = "";
  renderExpeditionModeButtons();
  renderExpeditions();
}

function renderExpeditions(){
  let articles = getShippedArticles();

  if(selectedExpMode){
    articles = articles.filter(a=>a.mode === selectedExpMode);
  }

  let dateCounts = {};
  articles.forEach(a=>{
    let d = (a.expedie || "").trim();
    dateCounts[d] = (dateCounts[d] || 0) + 1;
  });

  let dateBox = document.getElementById("expDateButtons");
  dateBox.innerHTML = "";

  let dates = Object.keys(dateCounts);

  if(selectedExpDate && !dateCounts[selectedExpDate]){
    selectedExpDate = "";
  }

  if(!selectedExpDate && dates.length){
    selectedExpDate = dates[0];
  }

  dates.forEach(date=>{
    dateBox.innerHTML += `<button class="${selectedExpDate===date?'active':''}" onclick="selectExpDate('${escapeForJs(date)}')">${escapeHtml(date)} (${dateCounts[date]})</button>`;
  });

  if(selectedExpDate){
    articles = articles.filter(a=>(a.expedie || "").trim() === selectedExpDate);
  }

  document.getElementById("expTitle").innerText = selectedExpMode && selectedExpDate ? `Expéditions ${selectedExpMode} - ${selectedExpDate}` : "Liste expédiée";
  document.getElementById("expTotal").innerText = selectedExpMode && selectedExpDate ? `Total : ${articles.length} article(s)` : "";

  let box = document.getElementById("expItems");
  let summary = document.getElementById("expSummary");
  box.innerHTML = "";
  summary.innerHTML = "";

  if(!articles.length){
    box.innerHTML = `<div class="empty">Aucune expédition disponible</div>`;
    document.getElementById("deleteAllExpBtn").style.display = "none";
    document.getElementById("downloadExpBtn").style.display = "none";
    return;
  }

  let totalCbm = 0;
  let totalKg = 0;
  let totalPrice = 0;

  articles.forEach(item=>{
    let mode = item.mode || "";
    let value = 0;
    let price = 0;
    let inputHtml = "";
    let resultHtml = "";

    if(mode === "SEA"){
      value = parseFloat(item.expCbm) || 0;
      price = value * getSeaPricePerCbm();
      totalCbm += value;
      totalPrice += price;
      inputHtml = `<input type="number" step="0.01" value="${item.expCbm || ""}" placeholder="CBM" onchange="updateShippingValue('${item.id}','expCbm',this.value)">`;
      resultHtml = `<div class="ship-result">${value.toLocaleString("fr-FR")} CBM<br>${formatAr(price)}</div>`;
    }else if(WEIGHT_MODES.includes(mode)){
      value = parseFloat(item.expKg) || 0;
      price = value * getKgPrice(mode);
      totalKg += value;
      totalPrice += price;
      inputHtml = `<input type="number" step="0.01" value="${item.expKg || ""}" placeholder="Kg" onchange="updateShippingValue('${item.id}','expKg',this.value)">`;
      resultHtml = `<div class="ship-result">${value.toLocaleString("fr-FR")} Kg<br>${formatAr(price)}</div>`;
    }

    box.innerHTML += `
      <div class="article">
        <div class="article-head">
          <div>
            <div class="article-ref">${escapeHtml(item.ref || "")}</div>
            <div class="article-name">${escapeHtml(item.name || "")}</div>
            <div class="count">Expédié : ${escapeHtml(item.expedie || "")}</div>
            <div class="count">${escapeHtml(item.createdBy || "")}</div>
          </div>
          <div class="badge">${escapeHtml(mode)}</div>
        </div>
        ${mode === "SEA" || WEIGHT_MODES.includes(mode) ? `
          <div class="ship-box">
            <div class="ship-row">
              ${inputHtml}
              ${resultHtml}
            </div>
          </div>
        ` : ""}
      </div>
    `;
  });

  if(selectedExpMode === "SEA"){
    summary.innerHTML = `
      <div class="summary-box">
        Total articles : ${articles.length}<br>
        CBM total : ${totalCbm.toLocaleString("fr-FR")} CBM<br>
        Prix total : ${formatAr(totalPrice)}
      </div>
    `;
  }else if(WEIGHT_MODES.includes(selectedExpMode)){
    summary.innerHTML = `
      <div class="summary-box">
        Total articles : ${articles.length}<br>
        Kg total : ${totalKg.toLocaleString("fr-FR")} Kg<br>
        Prix total : ${formatAr(totalPrice)}
      </div>
    `;
  }else{
    summary.innerHTML = `
      <div class="summary-box">
        Total articles : ${articles.length}
      </div>
    `;
  }

  document.getElementById("deleteAllExpBtn").style.display = "block";
  document.getElementById("downloadExpBtn").style.display = "block";
}

function escapeForJs(value){
  return String(value).replaceAll("\\","\\\\").replaceAll("'","\\'");
}

window.updateShippingValue = function(id,field,value){
  update(ref(db,`articles/${id}`), {[field]: value});
}

window.selectExpDate = function(date){
  selectedExpDate = date;
  renderExpeditions();
}

window.deleteAllCurrentExpedition = function(){
  if(!selectedExpMode || !selectedExpDate) return;

  let articles = getShippedArticles()
    .filter(a=>a.mode === selectedExpMode)
    .filter(a=>(a.expedie || "").trim() === selectedExpDate);

  if(!articles.length) return;

  let ok = confirm(`Supprimer définitivement ${articles.length} article(s) de ${selectedExpMode} du ${selectedExpDate} ?`);
  if(!ok) return;

  let verification = prompt(`Pour confirmer, écris SUPPRIMER`);
  if(verification !== "SUPPRIMER"){
    alert("Suppression annulée");
    return;
  }

  articles.forEach(a=>{
    remove(ref(db,`articles/${a.id}`));
  });
}

/* AUTRES */
window.downloadCurrentList = function(){
  html2canvas(document.getElementById("listCapture")).then(canvas=>{
    let link = document.createElement("a");
    link.download = `KIAH_${selectedMode || "liste"}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

window.downloadCurrentExpedition = function(){
  html2canvas(document.getElementById("expCapture")).then(canvas=>{
    let link = document.createElement("a");
    link.download = `KIAH_Expedition_${selectedExpMode || "liste"}_${selectedExpDate || "date"}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

window.openTab = function(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  if(id === "expeditions"){
    renderExpeditionModeButtons();
    renderExpeditions();
  }
}

window.calcSea = function(){
  let cbm = parseFloat(document.getElementById("cbm").value)||0;
  let prix = parseFloat(document.getElementById("prixCBM").value)||0;
  let usd = parseFloat(document.getElementById("usd").value)||0;
  document.getElementById("resultSea").innerText = formatAr(cbm*prix*usd);
}

window.calcAir = function(){
  let kg = parseFloat(document.getElementById("kg").value)||0;
  let prix = parseFloat(document.getElementById("prixKg").value)||0;
  document.getElementById("resultAir").innerText = formatAr(kg*prix);
}

window.calcExp = function(){
  let kg = parseFloat(document.getElementById("kgExp").value)||0;
  let prix = parseFloat(document.getElementById("prixKgExp").value)||0;
  document.getElementById("resultExp").innerText = formatAr(kg*prix);
}

window.calcAirBatt = function(){
  let kg = parseFloat(document.getElementById("kgAirBatt").value)||0;
  let prix = parseFloat(document.getElementById("prixKgAirBatt").value)||0;
  document.getElementById("resultAirBatt").innerText = formatAr(kg*prix);
}
</script>
